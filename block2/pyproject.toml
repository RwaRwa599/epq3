[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "med-doc-block2"
version = "0.1.0"
description = "Block 2 — Clinical Knowledge Graph & Prior Validation Engine for Medical Document Intelligence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["med_doc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
